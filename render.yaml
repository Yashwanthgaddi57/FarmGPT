# Render Blueprint — FastAPI backend for AgriGPT
# Deploy: Render Dashboard → New → Blueprint → point at this repo.
# Secrets are set in the Render dashboard (never commit real values).
services:
  - type: web
    name: agrigpt-api
    runtime: python
    plan: free
    region: singapore          # closest region to India on Render's free tier
    branch: main
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    # 2 workers; free tier has 512 MB. Scheduler ON (it powers alerts).
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: ENVIRONMENT
        value: production
      - key: API_V1_STR
        value: /api/v1
      # ── Supabase (project: isuzdemiozvhbszwaxhs) ──
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false            # secret — Render prompts for the value at deploy
      - key: SUPABASE_JWT_SECRET
        sync: false
      # CRITICAL: pooler URI (port 6543) — Postgres ports are open on Render,
      # so the real database takes over from SQLite. Format:
      # postgresql+psycopg://postgres.isuzdemiozvhbszwaxhs:PASSWORD@aws-0-ap-northeast-1.pooler.supabase.com:6543/postgres
      - key: SUPABASE_DB_URL
        sync: false            # secret (contains DB password) — prompted at deploy
      # ── AI (Bedrock — matches local .env) ──
      - key: AI_PROVIDER
        value: bedrock
      - key: BEDROCK_API_KEY
        sync: false            # secret — prompted at deploy
      - key: BEDROCK_REGION
        value: us-east-1
      - key: BEDROCK_MODEL_ID
        value: us.anthropic.claude-sonnet-5
      - key: ANTHROPIC_API_KEY
        sync: false            # optional fallback — leave empty unless you have one
      # ── Infra ──
      # Redis is optional (in-memory cache fallback is automatic). Add a free
      # Redis later (Render/Upstash) and set REDIS_URL to share cache+rate limits.
      - key: SCHEDULER_ENABLED
        value: "true"
      # pydantic-settings parses complex fields as JSON first — must be an array.
      # Adjust the first entry if the frontend service URL differs from the default.
      - key: BACKEND_CORS_ORIGINS
        value: '["https://agrigpt-web.onrender.com", "http://localhost:3000"]'
      # Frontend base URL for password-reset email links.
      - key: FRONTEND_APP_URL
        value: https://agrigpt-web.onrender.com
      # data.gov.in public trial key for live Agmarknet mandi prices.
      # Replace with your own registered key: https://data.gov.in/user/register
      - key: DATA_GOV_API_KEY
        value: 579b464db66ec23bdd000001cdd3946e44ce4aad7209ff7b23ac571b

  # ── Frontend (Next.js) ──
  - type: web
    name: agrigpt-web
    runtime: node
    plan: free
    region: singapore
    branch: main
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    startCommand: "npm run start"
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # NEXT_PUBLIC_* vars are inlined at build time — set them before the
      # first deploy (Render prompts for sync:false values).
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      # Backend base URL — the API service above (no /api/v1 suffix).
      - key: NEXT_PUBLIC_API_URL
        value: https://agrigpt-api.onrender.com
      # This frontend's own URL — used for OAuth redirect targets.
      - key: NEXT_PUBLIC_APP_URL
        value: https://agrigpt-web.onrender.com
      - key: SENTRY_DSN
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false

# Render Blueprint — FastAPI backend for AgriGPT
# Deploy: Render Dashboard → New → Blueprint → point at this repo.
# Secrets are set in the Render dashboard (never commit real values).
services:
  - type: web
    name: agrigpt-api
    runtime: python
    plan: free
    region: singapore          # closest region to India on Render's free tier
    branch: main
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    # 2 workers; free tier has 512 MB. Scheduler ON (it powers alerts).
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: ENVIRONMENT
        value: production
      - key: API_V1_STR
        value: /api/v1
      # ── Supabase (project: isuzdemiozvhbszwaxhs) ──
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: true             # secret — set in Render dashboard
      - key: SUPABASE_JWT_SECRET
        sync: false
      # CRITICAL: pooler URI (port 6543) — Postgres ports are open on Render,
      # so the real database takes over from SQLite. Format:
      # postgresql+psycopg://postgres.isuzdemiozvhbszwaxhs:PASSWORD@aws-0-ap-northeast-1.pooler.supabase.com:6543/postgres
      - key: SUPABASE_DB_URL
        sync: true             # secret (contains DB password) — set in dashboard
      # ── AI ──
      - key: AI_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: true
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5-20250929
      # ── Infra ──
      # Redis is optional (in-memory cache fallback is automatic). Add a free
      # Redis later (Render/Upstash) and set REDIS_URL to share cache+rate limits.
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: BACKEND_CORS_ORIGINS
        value: http://localhost:3000
      - key: SENTRY_DSN
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
